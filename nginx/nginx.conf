events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_api {
        server backend:8000;
    }

    upstream web_admin {
        server web_admin:3000;
    }

    upstream pwa_scanner {
        server pwa_scanner:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Web Admin Dashboard
        location / {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI Backend API & OpenAPI Docs
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /docs {
            proxy_pass http://backend_api/docs;
        }

        location /redoc {
            proxy_pass http://backend_api/redoc;
        }

        # PWA Warehouse Scanner
        location /pwa/ {
            proxy_pass http://pwa_scanner/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
