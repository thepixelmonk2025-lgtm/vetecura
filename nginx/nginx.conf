events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (Increased to 100r/s burst=60 to avoid 503 on dashboard batch loading)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=15r/s;

    upstream backend_api {
        server backend:8000;
    }

    upstream web_admin {
        server web_admin:3000;
    }

    upstream pwa_scanner {
        server pwa_scanner:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Web Admin Dashboard
        location /_next/static/ {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store";
        }

        # Telegram Notification Endpoint (Handled by Next.js Server Route)
        location = /api/notify {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth Login Endpoint with Rate Limiting (15 req/s)
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI Backend API & OpenAPI Docs
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /docs {
            proxy_pass http://backend_api/docs;
        }

        location /redoc {
            proxy_pass http://backend_api/redoc;
        }

        # PWA Warehouse Scanner
        location /pwa/ {
            proxy_pass http://pwa_scanner/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static assets fallback for PWA Scanner
        location /assets/ {
            proxy_pass http://pwa_scanner/assets/;
            proxy_set_header Host $host;
        }
    }
}
